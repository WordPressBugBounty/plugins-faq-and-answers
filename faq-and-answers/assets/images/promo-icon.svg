<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Awesome FAQ — question medallion with schema badge">
  <title>Awesome FAQ — question medallion</title>
  <style>
    :root { --faq: 3.6s; }
    .faqb-orbit { animation: faqb-orbit var(--faq) linear infinite; transform-box: view-box; transform-origin: 128px 116px; }
    .faqb-med { animation: faqb-bob var(--faq) ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .faqb-ring { animation: faqb-ring var(--faq) ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .faqb-chk { animation: faqb-chk var(--faq) ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes faqb-orbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes faqb-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes faqb-ring { 0% { transform: scale(.85); opacity:.5; } 70%,100% { transform: scale(1.35); opacity:0; } }
    @keyframes faqb-chk { 0%,100% { transform: scale(1); } 45% { transform: scale(1.18); } }
    @media (prefers-reduced-motion: reduce) {
      .faqb-orbit,.faqb-med,.faqb-ring,.faqb-chk { animation: none; }
      .faqb-ring { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="faqbTile" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e94e2b"/>
      <stop offset="1" stop-color="#ffa41e"/>
    </linearGradient>
    <linearGradient id="faqbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa41e"/>
      <stop offset="1" stop-color="#ef5a2a"/>
    </linearGradient>
    <linearGradient id="faqbCheck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="faqbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="faqbClip"><rect x="0" y="0" width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#faqbClip)">
    <rect x="0" y="0" width="256" height="256" fill="url(#faqbTile)"/>
    <circle cx="64" cy="58" r="70" fill="#ffffff" opacity="0.09"/>
    <circle cx="128" cy="120" r="110" fill="url(#faqbGlow)"/>

    <!-- Glass card -->
    <rect x="44" y="46" width="168" height="164" rx="30" fill="#ffffff" opacity="0.16"/>
    <rect x="44" y="46" width="168" height="164" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Orbiting answer dot -->
    <g class="faqb-orbit">
      <circle cx="128" cy="66" r="7" fill="#ffffff"/>
    </g>

    <!-- Question medallion -->
    <g class="faqb-med">
      <circle class="faqb-ring" cx="128" cy="116" r="46" fill="#ffffff" opacity="0.5"/>
      <circle cx="128" cy="116" r="46" fill="#ffffff"/>
      <text x="128" y="140" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="66" font-weight="800" fill="url(#faqbGrad)" text-anchor="middle">?</text>
    </g>

    <!-- Schema check badge -->
    <g class="faqb-chk">
      <circle cx="176" cy="176" r="22" fill="url(#faqbCheck)"/>
      <circle cx="176" cy="176" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
      <path d="M166 176 l7 7 l13 -15" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
